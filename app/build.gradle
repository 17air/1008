plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.cardify'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.cardify"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-firestore-ktx'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Apply the Google Services Gradle plugin only when a configuration file is present.
// This keeps local demo builds working even without a google-services.json file while
// still enabling Firebase integration for environments that include one.
def googleServicesCandidates = [
        file('google-services.json'),
        file('src/google-services.json'),
        file('src/debug/google-services.json'),
        rootProject.file('google-services.json'),
        rootProject.file('app/google-services.json')
]

if (googleServicesCandidates.any { it.exists() }) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('google-services.json not found – skipping Google Services plugin. Firebase features will remain disabled in this build.')
}
